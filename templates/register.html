<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Secure Login System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-wrapper">
    <div class="left-side">
        <div class="left-content">
            <h1>🛡️ Create Account</h1>
            <p>Join our secure platform with end-to-end encryption</p>
        </div>
    </div>

    <div class="right-side">
        <div class="form-container">
            <div class="form-header">
                <h2>Get Started</h2>
                <p>Create your secure account</p>
            </div>

            {% if message %}
                {% if message_type == "success" %}
                    <div class="alert alert-success">
                        <span class="alert-icon">✓</span>
                        <span>{{ message }}</span>
                    </div>
                {% else %}
                    <div class="alert alert-error">
                        <span class="alert-icon">❌</span>
                        <span>{{ message }}</span>
                    </div>
                {% endif %}
            {% endif %}

            <form method="POST" class="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required oninput="checkPasswordStrength()">
                    
                    <div class="password-strength-meter">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <div id="strength-text" class="strength-text">Password strength: Very Weak</div>
                    <div id="suggestions" class="suggestions"></div>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>

<script>
function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');
    const suggestionsDiv = document.getElementById('suggestions');
    
    let strength = 0;
    let suggestions = [];
    
    if (password.length === 0) {
        strengthBar.className = 'strength-bar';
        strengthText.className = 'strength-text';
        suggestionsDiv.innerHTML = '';
        return;
    }
    
    if (password.length >= 8) strength += 20;
    else suggestions.push('At least 8 characters');
    
    if (password.length >= 12) strength += 10;
    
    if (/[a-z]/.test(password)) strength += 15;
    else suggestions.push('Add lowercase letters (a-z)');
    
    if (/[A-Z]/.test(password)) strength += 15;
    else suggestions.push('Add uppercase letters (A-Z)');
    
    if (/[0-9]/.test(password)) strength += 15;
    else suggestions.push('Add numbers (0-9)');
    
    if (/[^A-Za-z0-9]/.test(password)) strength += 15;
    else suggestions.push('Add special characters (!@#$%^&*)');
    
    strength = Math.min(strength, 100);
    
    let level = 'very-weak';
    let levelText = 'Password strength: Very Weak';
    
    if (strength >= 20 && strength < 40) {
        level = 'weak';
        levelText = '⚠️ Password strength: Weak';
    } else if (strength >= 40 && strength < 60) {
        level = 'fair';
        levelText = '👍 Password strength: Fair';
    } else if (strength >= 60 && strength < 80) {
        level = 'good';
        levelText = '✓ Password strength: Good';
    } else if (strength >= 80) {
        level = 'strong';
        levelText = '💪 Password strength: Strong';
    }
    
    strengthBar.className = 'strength-bar ' + level;
    strengthText.className = 'strength-text ' + level;
    strengthText.textContent = levelText;
    
    if (suggestions.length === 0) {
        suggestionsDiv.innerHTML = '<div class="suggestions-success"><p>✓ Great password!</p></div>';
    } else {
        let suggestionsHTML = '<div class="suggestions-list"><p class="suggestions-label">✗ Missing:</p><ul>';
        suggestions.forEach(suggestion => {
            suggestionsHTML += '<li>' + suggestion + '</li>';
        });
        suggestionsHTML += '</ul></div>';
        suggestionsDiv.innerHTML = suggestionsHTML;
    }
}
</script>
</body>
</html>
